<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="sunburst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="80%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f2b66" />
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0e234a" />
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8860b" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b8860b" />
    </linearGradient>
  </defs>

  <!-- Sunburst rays -->
  <g transform="translate(100, 100)" stroke="#2563eb" stroke-width="2.5" opacity="0.8">
    <line x1="0" y1="-85" x2="0" y2="-65" />
    <line x1="60" y1="-60" x2="45" y2="-45" />
    <line x1="85" y1="0" x2="65" y2="0" />
    <line x1="60" y1="60" x2="45" y2="45" />
    <line x1="0" y1="85" x2="0" y2="65" />
    <line x1="-60" y1="60" x2="-45" y2="45" />
    <line x1="-85" y1="0" x2="-65" y2="0" />
    <line x1="-60" y1="-60" x2="-45" y2="-45" />
    <line x1="32" y1="-78" x2="25" y2="-60" />
    <line x1="78" y1="-32" x2="60" y2="-25" />
    <line x1="78" y1="32" x2="60" y2="25" />
    <line x1="32" y1="78" x2="25" y2="60" />
    <line x1="-32" y1="78" x2="-25" y2="60" />
    <line x1="-78" y1="32" x2="-60" y2="25" />
    <line x1="-78" y1="-32" x2="-60" y2="-25" />
    <line x1="-32" y1="-78" x2="-25" y2="-60" />
  </g>

  <!-- Shield Base -->
  <path d="M 50 35 Q 100 25 150 35 Q 155 105 100 165 Q 45 105 50 35 Z" 
        fill="url(#shieldGrad)" stroke="#60a5fa" stroke-width="3" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.3))" />

  <!-- Shield Inner Border -->
  <path d="M 58 43 Q 100 35 142 43 Q 146 100 100 152 Q 54 100 58 43 Z" 
        fill="none" stroke="#dbeafe" stroke-width="1.2" stroke-dasharray="3,2" />

  <!-- College Name Arch -->
  <path id="archPath" d="M 58 60 Q 100 45 142 60" fill="none" />
  <text font-size="9.5" font-family="Georgia, serif" font-weight="bold" fill="#ffffff" letter-spacing="1">
    <textPath href="#archPath" startOffset="50%" text-anchor="middle">JERUSALEM</textPath>
  </text>

  <!-- Gear / Cogwheel in center -->
  <g transform="translate(100, 95)">
    <!-- Gear teeth -->
    <circle cx="0" cy="0" r="26" fill="#dc2626" stroke="#b91c1c" stroke-width="1.5" />
    <g fill="#dc2626">
      <rect x="-4" y="-32" width="8" height="8" rx="1" />
      <rect x="-4" y="24" width="8" height="8" rx="1" />
      <rect x="-32" y="-4" width="8" height="8" rx="1" />
      <rect x="24" y="-4" width="8" height="8" rx="1" />
      <rect x="-24" y="-24" width="8" height="8" rx="1" transform="rotate(45)" />
      <rect x="16" y="-24" width="8" height="8" rx="1" transform="rotate(45)" />
      <rect x="-24" y="16" width="8" height="8" rx="1" transform="rotate(45)" />
      <rect x="16" y="16" width="8" height="8" rx="1" transform="rotate(45)" />
    </g>
    <!-- Inner gear hub -->
    <circle cx="0" cy="0" r="18" fill="#991b1b" stroke="#fef08a" stroke-width="1" />
    <!-- JCE text -->
    <text x="0" y="5" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">JCE</text>
  </g>

  <!-- Light / Flame / Book icon below gear -->
  <g transform="translate(100, 133)">
    <path d="M -12 2 Q 0 -6 12 2 Q 0 8 -12 2 Z" fill="#facc15" stroke="#ca8a04" stroke-width="0.8" />
    <path d="M 0 -8 Q 4 -1 0 2 Q -4 -1 0 -8 Z" fill="#f97316" />
  </g>

  <!-- Bottom Ribbon Banner -->
  <g transform="translate(100, 168)">
    <path d="M -75 -10 L 75 -10 L 68 8 L -68 8 Z" fill="url(#goldRibbon)" stroke="#78350f" stroke-width="1" />
    <text x="0" y="3" font-family="Arial, sans-serif" font-size="8.5" font-weight="900" fill="#1e1b4b" text-anchor="middle" letter-spacing="0.5">COLLEGE OF ENGG.</text>
  </g>
</svg>
